app-id: org.taboulet.SoberLauncher
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: SoberLauncher
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  # kdesrc-build itself
  - name: kdesrc-build
    buildsystem: simple
    build-commands:
      - install -Dm755 kdesrc-build /app/bin/kdesrc-build
    sources:
      - type: git
        url: https://github.com/KDE/kdesrc-build.git
        branch: master

  # Breeze via kdesrc-build
  - name: breeze
    buildsystem: simple
    builddir: true
    build-commands:
      # Minimal kdesrc-buildrc config for Qt6-only Breeze
      - |
        cat > kdesrc-buildrc <<'EOF'
        global
            source-dir /run/build/breeze/src
            build-dir /run/build/breeze/build
            install-dir /app
            kdedir /app
            cmake-options -DBUILD_QT5=OFF -DBUILD_QT6=ON
        end global

        module-set custom
            use-modules breeze
        end module-set
        EOF
      # Run kdesrc-build with the config
      - /app/bin/kdesrc-build --rc-file=kdesrc-buildrc breeze

  # Your app
  - name: soberlauncher
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - python3 -m pip install --no-deps --prefix=/app altgraph
      - python3 -m pip install --no-deps --prefix=/app PyQt6==6.9.0
      - python3 -m pip install --no-deps --prefix=/app PyQt6-sip==13.10.2
      - python3 -m pip install --no-deps --prefix=/app PyQt6-Qt6==6.9.0
      - python3 -m pip install --no-deps --prefix=/app pyinstaller
      - export PATH="/app/bin:$PATH"
      - pyinstaller --noconfirm SoberLauncher.spec
      - install -Dm755 dist/SoberLauncher /app/bin/SoberLauncher
      - install -Dm644 org.taboulet.SoberLauncher.desktop /app/share/applications/org.taboulet.SoberLauncher.desktop
      - install -Dm644 org.taboulet.SoberLauncher.svg /app/share/icons/hicolor/scalable/apps/org.taboulet.SoberLauncher.svg
    sources:
      - type: git
        url: https://github.com/Taboulet/SoberLauncher-Flatpak.git
        branch: main
      - type: file
        path: org.taboulet.SoberLauncher.desktop
      - type: file
        path: org.taboulet.SoberLauncher.svg
