app-id: io.github.taboulet.SoberLauncher-Flatpak
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: SoberLauncher

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: soberlauncher
    buildsystem: qmake
    config-opts: []
    build-commands:
      - make
      - make install
    sources:
      - type: git
        url: https://github.com/Taboulet/SoberLauncher-Flatpak.git
        branch: main
