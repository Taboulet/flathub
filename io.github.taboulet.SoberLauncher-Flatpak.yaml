app-id: org.taboulet.SoberLauncher
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: SoberLauncher

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: soberlauncher
    buildsystem: qmake
    build-options:
      build-args:
        - --share=network
        - --socket=system-bus
        - --socket=session-bus
    build-commands:
      - make
      - make install
    sources:
      - type: git
        url: https://github.com/Taboulet/SoberLauncher-Flatpak.git
        branch: main
