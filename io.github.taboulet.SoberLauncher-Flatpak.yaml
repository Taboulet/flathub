app-id: org.taboulet.SoberLauncher
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: SoberLauncher

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: soberlauncher
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-deps --prefix=/app pyqtdarktheme altgraph
      - python3 -m pip install --no-deps --prefix=/app PyQt6==6.8.0 PyQt6-sip==13.10.2 PyQt6-Qt6==6.8.1
      - python3 -m pip install --no-deps --prefix=/app pyinstaller
      - export PATH="/app/bin:$PATH"
      - pyinstaller --noconfirm SoberLauncher.spec
      - make install

    sources:
      - type: git
        url: https://github.com/Taboulet/SoberLauncher-Flatpak.git
        branch: main
        subdir: flatpak
